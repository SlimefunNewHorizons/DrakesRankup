name: Build and Verify DrakesRankup

on:
  push:
    branches: [ "main", "port-26x" ]
  pull_request:
    branches: [ "main", "port-26x" ]
  workflow_dispatch:

jobs:
  build:
    name: Maven Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Clone DrakesCraft Maven Repo Dependencies
        run: |
          mkdir -p ~/.m2/repository
          git clone --depth 1 https://github.com/SlimefunNewHorizons/maven-repo.git /tmp/drakes-maven-repo || true
          if [ -d /tmp/drakes-maven-repo/com ]; then
            cp -rn /tmp/drakes-maven-repo/com ~/.m2/repository/ || true
          fi

      - name: Compile and Run Tests
        run: mvn -B clean verify

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrakesRankup-Jar
          path: target/*.jar
          if-no-files-found: error

  seguridad:
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    uses: SlimefunNewHorizons/.github/.github/workflows/seguridad.yml@main
