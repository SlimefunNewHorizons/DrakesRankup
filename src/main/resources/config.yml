# DrakesRankup - Configuración Principal
settings:
  # Moneda e integración Vault
  currency-symbol: "$"
  
  # Sonido al subir de rango
  sound:
    enabled: true
    name: "entity.player.levelup"
    volume: 1.0
    pitch: 1.2

  # Título en pantalla al subir de rango
  title:
    enabled: true
    title: "&6&lRANK UNLOCKED!"
    subtitle: "&eYou advanced to &b{rank}"
    fade-in: 10
    stay: 50
    fade-out: 10

  # Anuncios en el Chat de Minecraft (Broadcast global)
  broadcast:
    enabled: true
    every-tier: 5   # anuncio global solo en hitos; los demas ascensos son locales (titulo, barra, particulas)
    message:
      - "&8&m--------------------------------------------------"
      - " &e&lDRAKES RANKUP &8✦ &6HISTORIC ASCENT!"
      - " &7Player &f{player} &7has reached Rank &b{rank}&7."
      - " &8[&e{division}&8] &8» &aTier {tier} / 100"
      - "&8&m--------------------------------------------------"

  # Integración LuckPerms (Cero colisión con Dioses VIP)
  luckperms:
    enabled: true
    apply-group: true
    group-prefix: "rankup_"
    remove-previous-rankup-group: true

  # Filtro de Mundos (Exclusivo para modalidades Custom: SF, OB, SKY)
  world-filter:
    enabled: true
    # BLACKLIST = deniega los mundos en disabled-worlds
    # WHITELIST = solo permite los mundos en enabled-worlds
    mode: "BLACKLIST"
    disabled-worlds:
      - "clasico"
      - "clasico_nether"
      - "clasico_the_end"
    enabled-worlds:
      - "world"
      - "world_nether"
      - "world_the_end"
      - "bskyblock_world"
      - "bskyblock_world_nether"
      - "bskyblock_world_the_end"
      - "oneblock_world"
      - "oneblock_world_nether"
      - "oneblock_world_the_end"
      - "galactifun_space"
      - "world_galactifun_earth_orbit"
      - "world_galactifun_the_moon"
      - "world_galactifun_mars"
      - "world_galactifun_venus"
      - "world_galactifun_titan"
      - "world_galactifun_enceladus"
      - "world_galactifun_io"
    blocked-message: "&c[DrakesCraft] The rank and transformation system is exclusive to custom modes (Survival SF, OneBlock, and SkyBlock). It is unavailable in Classic Survival."

  # Sistema de Mantención y Desgaste (Rank Maintenance & Decay)
  maintenance:
    enabled: true
    # Duración base de cada periodo de mantención (en días)
    period-days: 30
    # Máximo acumulable de días de mantención al renovar
    max-accumulated-days: 60
    # Modo de desgaste al expirar:
    # CHECKPOINT = Vuelve al último hito/ancla permanente de su división (o a tier 0 si no tiene)
    # RESET = Vuelve directamente a Tier 0
    # SINGLE_TIER = Pierde 1 tier
    decay-mode: "CHECKPOINT"
    # Porcentaje del costo del rango que se cobra como mantención por periodo (0.05 = 5%)
    cost-percentage: 0.05
    # Costo mínimo de mantención en Dragmas
    min-cost: 1000.0
    # Avisar al jugador al conectar si le quedan menos de X horas
    warning-threshold-hours: 120
    # Frecuencia de verificación en minutos
    check-interval-minutes: 30

messages:
  prefix: "&8[&6Rankup&8] "
  max-rank: "&aCongratulations! You have reached the maximum rank (&6Pirate King / Supreme Transcendent&a)."
  insufficient-funds: "&cYou do not have enough money to advance to &b{rank}&c. You need &e${missing}&c more."
  success: "&aYou advanced to &b{rank}&a! &e${cost}&a has been deducted from your balance."
  no-permission: "&cYou do not have permission to run this command."
  reload-success: "&aConfiguration and ranks reloaded successfully."

# El Infinito y dominios de Gojo (tier 19+). Comandos: /rankup dominio <vacio|santuario>
gojo:
  infinity:
    min-tier: 19
    base-chance: 0.08   # prob. de detener un proyectil en el tier minimo
    per-tier: 0.003
    max-chance: 0.25    # los golpes cuerpo a cuerpo usan la mitad
  domain:
    cooldown-seconds: 180
    duration-seconds: 6
    radius: 8
    supreme-tier: 60    # x1.25 de radio y duracion
    vacio: { min-tier: 19 }
    santuario: { min-tier: 20, damage: 1.5 }   # por pulso (cada 0.5 s); no afecta a jugadores ni jefes

# TECHO DE PODER de los rangos (ver ability/Balance.java). Los rangos VIP/Titan de la tienda mandan:
# Zeus/Thor = Fuerza II + Resistencia II + Velocidad IV por armadura; Titan Caos = UltraGod 45 s / 30 min,
# armadura Prot 40 y arma +10 de dano. Aqui nada pasa de Fuerza I / Resistencia I / Velocidad II.
balance:
  pve-hit-cap: 14            # dano maximo por golpe de habilidad a mobs
  pve-window-cap: 28         # dano de habilidad maximo a un mismo mob cada 5 s
  boss-health: 100           # vida maxima desde la que un mob cuenta como jefe
  boss-hit-cap: 6
  boss-window-cap: 12
  pvp-hit-cap: 4             # contra jugadores (respeta claims, ni creativo ni espectador)
  pvp-window-cap: 6
  knockback: 1.0
  pvp-knockback: 0.5         # a jefes no se les empuja
  bonus-scale: 0.4           # los multiplicadores de dano de rango solo aplican el 40 %
  pve-bonus-cap: 4           # dano extra maximo por golpe (suma de todas las fuentes)
  pvp-bonus-cap: 1.5
  boss-bonus-cap: 2
  min-single-mitigation: 0.92   # ninguna pasiva reduce mas de 8 % por separado
  min-total-mitigation: 0.85    # tope total -15 %
  dodge-max-chance: 0.06
  dodge-cooldown-seconds: 12
  cooldown-multiplier: 2.5   # sobre los cooldowns codificados de las habilidades activas
  min-cooldown-seconds: 10
  rebirth-cdr-max: 0.2
  form-seconds: 45           # duracion de las transformaciones (antes 240-300 s)
  form-cooldown-seconds: 240
  transformation-flight-seconds: 0   # sin vuelo gratis: el vuelo es de la tienda

# Herobrine publico (/herobrine)
herobrine:
  health: 400
  damage: 10
  cooldown-seconds: 600
  lifetime-seconds: 900
  reward-diamonds: 5

# Puente DrakesArcana: XP de Arcana por cada rango ganado (usa /arcana staff xp)
arcana-bridge:
  enabled: true
  xp-per-tier: 600   # XP plana por rango ganado (tier 19 = 11400 = CATALIZADOR)
