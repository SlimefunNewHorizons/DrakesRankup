# DrakesRankup - Configuración Principal
settings:
  # Moneda e integración Vault
  currency-symbol: "$"
  
  # Sonido al subir de rango
  sound:
    enabled: true
    name: "entity.player.levelup"
    volume: 1.0
    pitch: 1.2

  # Título en pantalla al subir de rango
  title:
    enabled: true
    title: "&6&l¡RANGO DESBLOQUEADO!"
    subtitle: "&eHas ascendido a &b{rank}"
    fade-in: 10
    stay: 50
    fade-out: 10

  # Anuncios en el Chat de Minecraft (Broadcast global)
  broadcast:
    enabled: true
    message:
      - "&8&m--------------------------------------------------"
      - " &e&lDRAKES RANKUP &8✦ &6¡ASCENSO HISTÓRICO!"
      - " &7El jugador &f{player} &7ha alcanzado el Rango &b{rank}&7."
      - " &8[&e{division}&8] &8» &aNivel {tier} / 100"
      - "&8&m--------------------------------------------------"

  # Integración LuckPerms (Cero colisión con Dioses VIP)
  luckperms:
    enabled: true
    apply-group: true
    group-prefix: "rankup_"
    remove-previous-rankup-group: true

  # Filtro de Mundos (Exclusivo para modalidades Custom: SF, OB, SKY)
  world-filter:
    enabled: true
    # BLACKLIST = deniega los mundos en disabled-worlds
    # WHITELIST = solo permite los mundos en enabled-worlds
    mode: "BLACKLIST"
    disabled-worlds:
      - "clasico"
      - "clasico_nether"
      - "clasico_the_end"
    enabled-worlds:
      - "world"
      - "world_nether"
      - "world_the_end"
      - "bskyblock_world"
      - "bskyblock_world_nether"
      - "bskyblock_world_the_end"
      - "oneblock_world"
      - "oneblock_world_nether"
      - "oneblock_world_the_end"
      - "galactifun_space"
      - "world_galactifun_earth_orbit"
      - "world_galactifun_the_moon"
      - "world_galactifun_mars"
      - "world_galactifun_venus"
      - "world_galactifun_titan"
      - "world_galactifun_enceladus"
      - "world_galactifun_io"
    blocked-message: "&c[DrakesCraft] El sistema de rangos y transformaciones es exclusivo de las modalidades custom (Survival SF, OneBlock y SkyBlock). ¡En Survival Clásico no está disponible!"

  # Sistema de Mantención y Desgaste (Rank Maintenance & Decay)
  maintenance:
    enabled: true
    # Duración base de cada periodo de mantención (en días)
    period-days: 30
    # Máximo acumulable de días de mantención al renovar
    max-accumulated-days: 60
    # Modo de desgaste al expirar:
    # CHECKPOINT = Vuelve al último hito/ancla permanente de su división (o a tier 0 si no tiene)
    # RESET = Vuelve directamente a Tier 0
    # SINGLE_TIER = Pierde 1 tier
    decay-mode: "CHECKPOINT"
    # Porcentaje del costo del rango que se cobra como mantención por periodo (0.05 = 5%)
    cost-percentage: 0.05
    # Costo mínimo de mantención en Dragmas
    min-cost: 1000.0
    # Avisar al jugador al conectar si le quedan menos de X horas
    warning-threshold-hours: 120
    # Frecuencia de verificación en minutos
    check-interval-minutes: 30

messages:
  prefix: "&8[&6Rankup&8] "
  max-rank: "&a¡Felicidades! Ya has alcanzado el rango máximo (&6Rey de los Piratas / Trascendente Supremo&a)."
  insufficient-funds: "&cNo tienes suficiente dinero para subir a &b{rank}&c. Te faltan &e${missing}&c."
  success: "&a¡Has ascendido con éxito a &b{rank}&a! Se han descontado &e${cost}&a de tu cuenta."
  no-permission: "&cNo tienes permisos para ejecutar este comando."
  reload-success: "&aConfiguración y rangos recargados correctamente."

# Bono de dinero de Jobs (Jobs Reborn): multiplica lo que pagan los trabajos segun el rango,
# los renacimientos y el VIP++ (bono de banda + booster de dinero). Tier 100 = +50% con estos valores.
jobs-boost:
  enabled: true
  money-per-tier: 0.005      # +0.5% por tier
  money-per-rebirth: 0.01    # +1% por renacimiento
  include-vip: true          # multiplica por DrakesVipApi.getJobsMoneyMultiplier
  boost-points: false        # tambien los puntos de Jobs (false = solo dinero)
  cap: 3.0                   # tope del multiplicador total

# Bono de XP de skills de AuraSkills por rango y renacimientos (permiso auraskills.multiplier.<N>).
# Se suma al booster de skills de VIP++. Tier 100 = +30% con estos valores.
skills-boost:
  enabled: true
  percent-per-tier: 0.3        # +0.3% de XP por tier
  percent-per-rebirth: 0.5     # +0.5% por renacimiento
  cap-percent: 60              # tope del bono de Rankup
