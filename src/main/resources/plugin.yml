name: DrakesRankup
version: '${project.version}'
main: com.drakescraft.rankup.DrakesRankupPlugin
api-version: '1.21'
author: DrakesCraft-Labs
description: Sistema oficial de 50 Rangos Anime/Shonen, Transformaciones Saiyajin, Modo Angel y Sumidero de Economía
softdepend: [Vault, LuckPerms, PlaceholderAPI]
commands:
  rankup:
    description: Opens the Rankup menu, ranks up, or manages trials.
    aliases: [ranks, rangos, subirrango]
  angel:
    description: Angelic staff mode (invulnerability and Infinite Ultra Instinct).
    aliases: [zenosama, zeno, daishinkan]
    permission: drakesrankup.staff
  transform:
    description: Opens the interactive menu for anime transformations and powers.
    aliases: [transformaciones, ki, poderes, transformacion]
  rebirth:
    description: Supreme Rebirth system with up to 50 levels.
    aliases: [renacer, renacimiento, rebirths]
